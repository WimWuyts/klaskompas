name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntaxcheck van alle app-modules
        run: |
          set -e
          find app/src app/sw.js -name '*.js' -print0 | while IFS= read -r -d '' f; do
            node --check "$f"
          done

      - name: Unit-tests (zuivere domeinlogica)
        run: node --test test/*.test.mjs
